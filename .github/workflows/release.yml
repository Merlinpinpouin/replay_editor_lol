# Release : pousser un tag vX.Y.Z sur main construit l'installeur Windows et publie la release GitHub.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Version du tag = version de l'appli
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $tag) { throw "tag $tag != version $($conf.version) (desktop/src-tauri/tauri.conf.json)" }

      - name: Construire l'installeur
        shell: pwsh
        run: ./scripts/build.ps1 -DownloadFfmpeg

      - uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
